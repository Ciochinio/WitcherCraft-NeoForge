<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WitcherCraft map layout creator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14141a;color:#e8e8ef;font:13px/1.45 Consolas,monospace}header{padding:10px 16px;border-bottom:1px solid #33333d}h1{font-size:16px;margin:0}.wrap{display:flex;gap:16px;padding:16px;flex-wrap:wrap}.stage{position:relative;width:640px;height:360px;background:#0b0b0f;border:1px solid #444}.nav{position:absolute;width:100%;height:41px;background:#201d22;color:#888;text-align:center;padding:13px}.content{position:absolute;left:3px;top:41px;width:634px;height:316px}.view,.bar,.button{position:absolute;border:1px solid #766b54}.view{background-color:#11151a;background-image:linear-gradient(#252c31 1px,transparent 1px),linear-gradient(90deg,#252c31 1px,transparent 1px);background-size:16px 16px}.bar{background:#121217}.button{background:#26262e;text-align:center;padding-top:3px;color:#e4ddcb}.side{width:520px}fieldset{border:1px solid #33333d;margin-bottom:10px}label{display:inline-flex;gap:5px;align-items:center;margin:3px 8px}input{width:62px;background:#0e0e13;color:#eee;border:1px solid #444;padding:3px}button{background:#292932;color:#eee;border:1px solid #555;padding:6px 10px;margin:4px}textarea{width:100%;height:260px;background:#0e0e13;color:#cfe8cf;border:1px solid #444;padding:8px}
</style></head>
<body><header><h1>WitcherCraft map layout creator</h1><div>The navbar is a fixed reference. Edit the viewport and bottom bar, then copy MapLayout.java.</div></header>
<div class="wrap"><div class="stage"><div class="nav">shared navbar, non-editable</div><div class="content" id="content"></div></div><div class="side"><fieldset><legend>Geometry</legend><div id="inputs"></div></fieldset><fieldset><legend>Colors</legend><div id="colorInputs"></div></fieldset><button id="copy">Copy MapLayout.java</button><button id="reset">Reset</button><textarea id="out"></textarea><fieldset><legend>Import from Java</legend><textarea id="import" style="height:110px" placeholder="Paste MapLayout.java"></textarea><button id="load">Import</button></fieldset></div></div>
<script>
const defaults={VIEW_X:0,VIEW_Y:0,VIEW_W:634,VIEW_H:277,BAR_X:0,BAR_Y:281,BAR_W:634,BAR_H:35,BUTTON_Y:7,BUTTON_H:21,BUTTON_GAP:5,WAYPOINTS_X:8,WAYPOINTS_W:70,FILTERS_X:83,FILTERS_W:55,CENTER_X:436,CENTER_W:64,ZOOM_OUT_X:505,ZOOM_W:28,ZOOM_IN_X:538,COORD_X:146,COORD_Y:13,HINT_X:574,HINT_Y:13};
const defaultColors={VIEW_BG:'0xFF11151A',VIEW_BORDER:'0xFF665E4A',GRID_MINOR:'0xFF252C31',GRID_MAJOR:'0xFF485057',GRID_AXIS:'0xFF9B704D',BAR_BG:'0xE6121217',BUTTON_BG:'0xFF26262E',BUTTON_HOVER:'0xFF393944',BUTTON_DISABLED:'0xFF19191E',TEXT:'0xFFE4DDCB',TEXT_DIM:'0xFF777781',PLAYER:'0xFFFFDD55'};
let v={...defaults},colors={...defaultColors};const inputs=document.querySelector('#inputs'),colorInputs=document.querySelector('#colorInputs'),content=document.querySelector('#content'),out=document.querySelector('#out');
for(const k of Object.keys(v)){const l=document.createElement('label');l.textContent=k;const i=document.createElement('input');i.type='number';i.value=v[k];i.oninput=()=>{v[k]=Number(i.value);render()};i.dataset.key=k;l.append(i);inputs.append(l)}
for(const k of Object.keys(colors)){const l=document.createElement('label');l.textContent=k;const i=document.createElement('input');i.type='text';i.value=colors[k];i.oninput=()=>{colors[k]=i.value;render()};i.dataset.key=k;l.append(i);colorInputs.append(l)}
function box(cls,x,y,w,h,text=''){const d=document.createElement('div');d.className=cls;Object.assign(d.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});d.textContent=text;content.append(d)}
function render(){content.innerHTML='';box('view',v.VIEW_X,v.VIEW_Y,v.VIEW_W,v.VIEW_H);box('bar',v.BAR_X,v.BAR_Y,v.BAR_W,v.BAR_H);for(const [x,w,t] of [[v.WAYPOINTS_X,v.WAYPOINTS_W,'Waypoints'],[v.FILTERS_X,v.FILTERS_W,'Filters'],[v.CENTER_X,v.CENTER_W,'Center'],[v.ZOOM_OUT_X,v.ZOOM_W,'-'],[v.ZOOM_IN_X,v.ZOOM_W,'+']])box('button',v.BAR_X+x,v.BAR_Y+v.BUTTON_Y,w,v.BUTTON_H,t);out.value=javaText()}
function javaText(){let s='package net.redboltmedia.witchercraft;\n\n/** Generated by tools/map-layout-creator.html. */\npublic final class MapLayout {\n\tprivate MapLayout() {}\n\n';for(const [k,n] of Object.entries(v))s+='\tpublic static final int '+k+' = '+n+';\n';s+='\n';for(const [k,n] of Object.entries(colors))s+='\tpublic static final int '+k+' = '+n+';\n';return s+'}\n'}
document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(out.value);document.querySelector('#reset').onclick=()=>{v={...defaults};colors={...defaultColors};sync();render()};document.querySelector('#load').onclick=()=>{const s=document.querySelector('#import').value;for(const k of Object.keys(v)){const m=s.match(new RegExp('int\\s+'+k+'\\s*=\\s*(-?\\d+)'));if(m)v[k]=Number(m[1])}for(const k of Object.keys(colors)){const m=s.match(new RegExp('int\\s+'+k+'\\s*=\\s*(0x[0-9A-Fa-f]+)'));if(m)colors[k]=m[1]}sync();render()};function sync(){for(const i of inputs.querySelectorAll('input'))i.value=v[i.dataset.key];for(const i of colorInputs.querySelectorAll('input'))i.value=colors[i.dataset.key]}render();
</script></body></html>
