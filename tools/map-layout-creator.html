<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>WitcherCraft map layout creator</title>
	<style>
		:root {
			--bg: #14141a;
			--panel: #1b1b22;
			--panel-2: #0e0e13;
			--line: #33333d;
			--line-soft: #2a2a33;
			--ink: #e8e8ef;
			--ink-dim: #9a9aa6;
			--accent: #c7a95b;
			--code: #cfe8cf;
			--stage-bg: #0b0b0f;
			--nav-bg: #201d22;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font: 13px/1.5 Consolas, "Cascadia Mono", monospace;
		}

		header {
			padding: 14px 20px;
			border-bottom: 1px solid var(--line);
			background: linear-gradient(180deg, #191921, var(--bg));
		}

		header h1 {
			margin: 0 0 4px;
			font-size: 17px;
			letter-spacing: .5px;
			color: var(--accent);
		}

		header p {
			margin: 0;
			color: var(--ink-dim);
		}

		.wrap {
			display: flex;
			gap: 20px;
			padding: 20px;
			flex-wrap: wrap;
			align-items: flex-start;
		}

		/* ---- Preview stage ---- */
		.stage {
			position: relative;
			width: 640px;
			height: 360px;
			background: var(--stage-bg);
			border: 1px solid #444;
			border-radius: 4px;
			overflow: hidden;
			box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
		}

		.nav {
			position: absolute;
			width: 100%;
			height: 41px;
			background: var(--nav-bg);
			color: #888;
			text-align: center;
			padding: 13px;
		}

		.content {
			position: absolute;
			left: 3px;
			top: 41px;
			width: 634px;
			height: 316px;
		}

		.view, .bar, .button, .selection, .help {
			position: absolute;
			border: 1px solid #766b54;
		}

		.view {
			background-color: #11151a;
			background-image:
				linear-gradient(#252c31 1px, transparent 1px),
				linear-gradient(90deg, #252c31 1px, transparent 1px);
			background-size: 16px 16px;
		}

		.bar { background: #121217; }

		.button {
			background: #26262e;
			text-align: center;
			padding-top: 3px;
			color: #e4ddcb;
		}

		.selection {
			background: rgba(23, 23, 28, .96);
			color: #d6ad52;
			text-align: center;
			padding-top: 4px;
			line-height: 14px;
		}

		.selection small { color: #888; }

		.help {
			border: 0;
			color: #888;
			font-size: 10px;
			white-space: nowrap;
		}

		/* ---- Control panel ---- */
		.side {
			width: 520px;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		fieldset {
			border: 1px solid var(--line);
			border-radius: 4px;
			margin: 0 0 12px;
			padding: 8px 10px 10px;
			background: var(--panel);
		}

		legend {
			padding: 0 6px;
			color: var(--accent);
			font-size: 12px;
			letter-spacing: .5px;
			text-transform: uppercase;
		}

		label {
			display: inline-flex;
			gap: 6px;
			align-items: center;
			margin: 3px 8px 3px 0;
			color: var(--ink-dim);
			font-size: 11px;
		}

		input {
			width: 66px;
			background: var(--panel-2);
			color: var(--ink);
			border: 1px solid #444;
			border-radius: 3px;
			padding: 3px 5px;
			font: inherit;
		}

		input:focus {
			outline: none;
			border-color: var(--accent);
		}

		.actions {
			display: flex;
			gap: 8px;
			margin: 4px 0 10px;
		}

		button {
			background: var(--panel);
			color: var(--ink);
			border: 1px solid #555;
			border-radius: 3px;
			padding: 7px 14px;
			font: inherit;
			cursor: pointer;
			transition: border-color .12s, background .12s;
		}

		button:hover {
			border-color: var(--accent);
			background: #24242d;
		}

		#copy {
			border-color: var(--accent);
			color: var(--accent);
		}

		textarea {
			width: 100%;
			height: 260px;
			background: var(--panel-2);
			color: var(--code);
			border: 1px solid #444;
			border-radius: 4px;
			padding: 10px;
			font: inherit;
			resize: vertical;
		}

		textarea:focus {
			outline: none;
			border-color: var(--accent);
		}
	</style>
</head>
<body>
	<header>
		<h1>WitcherCraft map layout creator</h1>
		<p>The navbar is a fixed reference. Edit the viewport and bottom bar, then copy MapLayout.java.</p>
	</header>

	<div class="wrap">
		<div class="stage">
			<div class="nav">shared navbar, non-editable</div>
			<div class="content" id="content"></div>
		</div>

		<div class="side">
			<fieldset>
				<legend>Geometry</legend>
				<div id="inputs"></div>
			</fieldset>

			<fieldset>
				<legend>Colors</legend>
				<div id="colorInputs"></div>
			</fieldset>

			<div class="actions">
				<button id="copy">Copy MapLayout.java</button>
				<button id="reset">Reset</button>
			</div>

			<textarea id="out"></textarea>

			<fieldset>
				<legend>Import from Java</legend>
				<textarea id="import" style="height:110px" placeholder="Paste MapLayout.java"></textarea>
				<div class="actions">
					<button id="load">Import</button>
				</div>
			</fieldset>
		</div>
	</div>

	<script>
		const defaults = {VIEW_X:-3,VIEW_Y:-4,VIEW_W:639,VIEW_H:286,BAR_X:-4,BAR_Y:281,BAR_W:640,BAR_H:35,BUTTON_Y:7,BUTTON_H:21,BUTTON_GAP:5,WAYPOINTS_X:8,WAYPOINTS_W:70,FILTERS_X:83,FILTERS_W:55,CENTER_X:436,CENTER_W:64,ZOOM_OUT_X:505,ZOOM_W:28,ZOOM_IN_X:538,COORD_X:146,COORD_Y:13,HINT_X:574,HINT_Y:13,HELP_X:146,HELP_Y:13,HELP_W:282,CREATE_W:250,CREATE_H:142,CREATE_PADDING:14,CREATE_NAME_Y:34,CREATE_NAME_H:18,CREATE_ICON_Y:68,CREATE_ICON_SIZE:24,CREATE_ICON_GAP:5,CREATE_ACTION_Y:113,CREATE_ACTION_W:68,MANAGER_W:390,MANAGER_H:190,MANAGER_PADDING:12,MANAGER_SEARCH_Y:30,MANAGER_SEARCH_H:18,MANAGER_LIST_Y:56,MANAGER_ROW_H:29,MANAGER_VISIBLE_ROWS:4,MANAGER_ACTION_X:230,SELECTION_W:280,SELECTION_H:40,SELECTION_BOTTOM:6};
		const defaultColors = {VIEW_BG:'0xFF11151A',VIEW_BORDER:'0xFF665E4A',GRID_MINOR:'0xFF252C31',GRID_MAJOR:'0xFF485057',GRID_AXIS:'0xFF9B704D',BAR_BG:'0xE6121217',BUTTON_BG:'0xFF26262E',BUTTON_HOVER:'0xFF393944',BUTTON_DISABLED:'0xFF19191E',TEXT:'0xFFE4DDCB',TEXT_DIM:'0xFF777781',OVERLAY_DIM:'0xB8000000',OVERLAY_BG:'0xFF17171C',OVERLAY_BORDER:'0xFF9B704D',FIELD_BG:'0xFF0D0D11',SELECTED:'0xFFD6AD52',ERROR:'0xFFE06A5F',WAYPOINT_COLOR:'0xFFD6AD52'};

		let v = {...defaults}, colors = {...defaultColors};
		const inputs = document.querySelector('#inputs'),
			colorInputs = document.querySelector('#colorInputs'),
			content = document.querySelector('#content'),
			out = document.querySelector('#out');

		for (const k of Object.keys(v)) {
			const l = document.createElement('label');
			l.textContent = k;
			const i = document.createElement('input');
			i.type = 'number';
			i.value = v[k];
			i.oninput = () => { v[k] = Number(i.value); render(); };
			i.dataset.key = k;
			l.append(i);
			inputs.append(l);
		}

		for (const k of Object.keys(colors)) {
			const l = document.createElement('label');
			l.textContent = k;
			const i = document.createElement('input');
			i.type = 'text';
			i.value = colors[k];
			i.oninput = () => { colors[k] = i.value; render(); };
			i.dataset.key = k;
			l.append(i);
			colorInputs.append(l);
		}

		function box(cls, x, y, w, h, text = '') {
			const d = document.createElement('div');
			d.className = cls;
			Object.assign(d.style, {left:x+'px', top:y+'px', width:w+'px', height:h+'px'});
			d.textContent = text;
			content.append(d);
		}

		function render() {
			content.innerHTML = '';
			box('view', v.VIEW_X, v.VIEW_Y, v.VIEW_W, v.VIEW_H);
			box('bar', v.BAR_X, v.BAR_Y, v.BAR_W, v.BAR_H);
			for (const [x, w, t] of [
				[v.WAYPOINTS_X, v.WAYPOINTS_W, 'Waypoints'],
				[v.FILTERS_X, v.FILTERS_W, 'Filters'],
				[v.CENTER_X, v.CENTER_W, 'Center'],
				[v.ZOOM_OUT_X, v.ZOOM_W, '-'],
				[v.ZOOM_IN_X, v.ZOOM_W, '+']
			]) box('button', v.BAR_X + x, v.BAR_Y + v.BUTTON_Y, w, v.BUTTON_H, t);
			box('help', v.BAR_X + v.HELP_X, v.BAR_Y + v.HELP_Y, v.HELP_W, 12, 'Drag Move | RMB Target | RMB x2 Waypoint | Wheel Zoom');
			box('selection', v.VIEW_X + (v.VIEW_W - v.SELECTION_W) / 2, v.VIEW_Y + v.VIEW_H - v.SELECTION_BOTTOM - v.SELECTION_H, v.SELECTION_W, v.SELECTION_H, 'CUSTOM MARKER');
			const selection = content.lastElementChild;
			selection.insertAdjacentHTML('beforeend', '<br><small>X 120  Z -340</small>');
			box('button', v.VIEW_X + (v.VIEW_W - v.CREATE_W) / 2, v.VIEW_Y + (v.VIEW_H - v.CREATE_H) / 2, v.CREATE_W, v.CREATE_H, 'Create waypoint overlay');
			out.value = javaText();
		}

		function javaText() {
			let s = 'package net.redboltmedia.witchercraft;\n\n/** Generated by tools/map-layout-creator.html. */\npublic final class MapLayout {\n\tprivate MapLayout() {}\n\n';
			for (const [k, n] of Object.entries(v)) s += '\tpublic static final int ' + k + ' = ' + n + ';\n';
			s += '\n';
			for (const [k, n] of Object.entries(colors)) s += '\tpublic static final int ' + k + ' = ' + n + ';\n';
			return s + '}\n';
		}

		document.querySelector('#copy').onclick = () => navigator.clipboard.writeText(out.value);
		document.querySelector('#reset').onclick = () => { v = {...defaults}; colors = {...defaultColors}; sync(); render(); };
		document.querySelector('#load').onclick = () => {
			const s = document.querySelector('#import').value;
			for (const k of Object.keys(v)) {
				const m = s.match(new RegExp('int\\s+' + k + '\\s*=\\s*(-?\\d+)'));
				if (m) v[k] = Number(m[1]);
			}
			for (const k of Object.keys(colors)) {
				const m = s.match(new RegExp('int\\s+' + k + '\\s*=\\s*(0x[0-9A-Fa-f]+)'));
				if (m) colors[k] = m[1];
			}
			sync();
			render();
		};

		function sync() {
			for (const i of inputs.querySelectorAll('input')) i.value = v[i.dataset.key];
			for (const i of colorInputs.querySelectorAll('input')) i.value = colors[i.dataset.key];
		}

		render();
	</script>
</body>
</html>
